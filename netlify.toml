[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA: serve index.html for client-side routes (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
